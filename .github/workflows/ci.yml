name: CI

# Runs on every pull request and every push to main.
#
# Two design rules:
#   * No secret is required. Fork pull requests get the full validation,
#     including the Sentry integration, because those tests use the local
#     recording transport rather than a real project.
#   * Every job creates its own databases. Nothing is reused between runs and
#     no database file is ever cached — see the "Databases" note below.
#
# `workflow_call` exists so the release workflow can run this exact gate rather
# than a copy of it. A release must not be able to pass a weaker check than a
# pull request, which is what a second, drifting copy of these jobs would
# eventually mean.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  # Shared by both halves so a CI run reports one release to Sentry.
  GIT_COMMIT_SHA: ${{ github.sha }}
  CI_RUN_ID: ${{ github.run_id }}

jobs:
  # ---------------------------------------------------------------------------
  # Formatting, linting and types. Cheap, and the most common reason to fail.
  # ---------------------------------------------------------------------------
  static-analysis:
    name: Format, lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'

      # Node, although every script here runs through Bun.
      #
      # Three of the tools this workflow drives are `#!/usr/bin/env node`
      # scripts, and without Node on PATH Bun stands in for it — which does not
      # fail, it under-delivers: vue-tsc stops reporting real type errors, V8
      # coverage collects nothing and reports 0 %, and Playwright's workers exit
      # cleanly in the middle of a test. All three were found exactly that way.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: api/Directory.Packages.props

      # --frozen-lockfile fails if bun.lock does not match package.json, which
      # is how a forgotten lockfile update is caught.
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Restore .NET tools and packages
        run: |
          dotnet tool restore
          dotnet restore api/q2.slnx

      - name: Backend formatting
        run: dotnet format api/q2.slnx --verify-no-changes --no-restore

      - name: Frontend lint (includes formatting)
        run: bun run --cwd app lint

      - name: Frontend typecheck
        run: bun run --cwd app typecheck

      # The contract and the generated types are committed. Regenerating them
      # must produce no diff, or the two halves have drifted apart.
      - name: API contract is up to date
        run: |
          bun run api:openapi
          if ! git diff --exit-code -- api/openapi app/app/api/generated; then
            echo "::error::The OpenAPI contract or the generated types are out of date. Run 'bun run api:openapi' and commit the result."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Backend: unit, integration, persistence, migration and Sentry tests.
  # Every test creates its own SQLite database; nothing is provisioned here.
  # ---------------------------------------------------------------------------
  backend:
    name: Backend tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: api/Directory.Packages.props

      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore api/q2.slnx

      - name: Unit tests
        run: dotnet test api/tests/Q2.Api.UnitTests --no-restore --nologo

      - name: Integration tests (API, persistence, Sentry)
        run: dotnet test api/tests/Q2.Api.IntegrationTests --no-restore --nologo

      # Run again on their own so a failure names the migrations explicitly in
      # the job log rather than being buried in the full run.
      - name: Migration tests
        run: dotnet test api/tests/Q2.Api.IntegrationTests --no-restore --nologo --filter Category=Migrations

      - name: Sentry integration tests (recording transport, no secrets)
        run: dotnet test api/tests/Q2.Api.IntegrationTests --no-restore --nologo --filter Category=Sentry

      # Release is where TreatWarningsAsErrors applies.
      - name: Release build
        run: dotnet build api/q2.slnx -c Release --no-restore --nologo

  # ---------------------------------------------------------------------------
  # Frontend: unit tests, component tests and the production build.
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'

      # Node, although every script here runs through Bun.
      #
      # Three of the tools this workflow drives are `#!/usr/bin/env node`
      # scripts, and without Node on PATH Bun stands in for it — which does not
      # fail, it under-delivers: vue-tsc stops reporting real type errors, V8
      # coverage collects nothing and reports 0 %, and Playwright's workers exit
      # cleanly in the middle of a test. All three were found exactly that way.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun run --cwd app test:unit

      - name: Component tests
        run: bun run --cwd app test:component

      - name: Sentry filter tests
        run: bun run --cwd app test:sentry

      # No SENTRY_AUTH_TOKEN here on purpose: the build must succeed without
      # it, which is what makes fork pull requests work. Source maps are
      # uploaded by the release workflow only.
      - name: Production build
        run: bun run --cwd app build

  # ---------------------------------------------------------------------------
  # E2E: real API, real production build, real browser, fresh database.
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'

      # Node, although every script here runs through Bun.
      #
      # Three of the tools this workflow drives are `#!/usr/bin/env node`
      # scripts, and without Node on PATH Bun stands in for it — which does not
      # fail, it under-delivers: vue-tsc stops reporting real type errors, V8
      # coverage collects nothing and reports 0 %, and Playwright's workers exit
      # cleanly in the middle of a test. All three were found exactly that way.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: api/Directory.Packages.props

      - name: Install
        run: |
          bun install --frozen-lockfile
          dotnet tool restore
          dotnet restore api/q2.slnx

      - name: Install Playwright browser
        run: bun x playwright install --with-deps chromium
        working-directory: app

      # Playwright starts both servers itself. The API creates, migrates and
      # seeds a temporary SQLite file per run and deletes it afterwards, so
      # there is no database to provision and none to cache.
      - name: Run E2E tests
        run: bun run --cwd app test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report
          retention-days: 7
